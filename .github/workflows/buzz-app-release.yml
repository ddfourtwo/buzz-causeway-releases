name: Buzz 1.0 release

# Build, sign, notarize and publish a macOS build of the Causeway fork of
# block/buzz-app (Buzz 1.0).
#
# macOS-only on purpose: the machines that run this fork are Apple Silicon, and
# Windows/Linux targets would multiply CI cost for nobody.
#
# No Tauri updater: this fork updates itself through ~/GitHub/buzz-app/sync.sh
# (git-based, daily launchd job), so no TAURI_SIGNING_PRIVATE_KEY or updater feed
# is involved.
#
# Notarization is done by hand here rather than by Tauri, because Tauri signing
# covers the .app but not the helper binaries that beforeBuildCommand stages into
# Contents/Resources/bin (buzz, buzz-agent-command, goose-acp). Those are unsigned
# by default, which fails notarization with "The binary is not signed with a valid
# Developer ID certificate" and "does not have the hardened runtime enabled".
# So: build signed-but-not-notarized, sign every nested binary, deep-sign the app,
# then notarize and staple.
#
# Required secrets:
#   BUZZ_APP_DEPLOY_KEY          read-only deploy key for ddfourtwo/buzz-app-fork
#   APPLE_CERTIFICATE            Developer ID Application .p12, base64
#   APPLE_CERTIFICATE_PASSWORD   its password
#   APPLE_API_ISSUER             App Store Connect issuer UUID
#   APPLE_API_KEY                App Store Connect key id
#   APPLE_API_PRIVATE_KEY        App Store Connect AuthKey .p8 contents

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag in ddfourtwo/buzz-app-fork to build
        required: true
        default: causeway
      version:
        description: Version to publish, e.g. 1.0.0-causeway.6
        required: true
      base_tag:
        description: Upstream block/buzz-app tag the stack sits on, e.g. v1.0.0
        required: false
        default: v1.0.0

permissions:
  contents: read

concurrency:
  group: buzz-app-release
  cancel-in-progress: false

env:
  APPLE_SIGNING_IDENTITY: "Developer ID Application: Beoflow B.V. (2D9Q24N9UQ)"

jobs:
  setup:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Validate version and that it is not already published
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' \
            || { echo "::error::version '$VERSION' is not semver"; exit 1; }
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already published"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release-macos:
    name: macOS (arm64)
    needs: [setup]
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.src.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ddfourtwo/buzz-app-fork
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.BUZZ_APP_DEPLOY_KEY }}
          fetch-depth: 0

      - name: Record the source commit
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # This repo carries its own pinned toolchain (node, pnpm, cargo).
      - uses: cashapp/activate-hermit@v1
        with:
          cache: "true"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Tauri imports the certificate into a temporary keychain for its own signing
      # and tears it down when it exits, so later codesign calls find no identity
      # ("no identity found"). Import it here and keep it for the rest of the job.
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          # Keep the login keychain in the search list; codesign needs ours first.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | tail -3
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build the app (signed, not yet notarized)
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          # No APPLE_API_* here: that would make Tauri notarize a bundle whose
          # nested helper binaries are still unsigned. --config sets the version
          # upstream would inject from its release tag (tauri.conf.json says 0.7.0).
          pnpm tauri build --bundles app --config "{\"version\":\"$VERSION\"}"

      - name: Sign every nested binary, then the app
        run: |
          set -euo pipefail
          APP="target/release/bundle/macos/Buzz.app"
          shopt -s nullglob
          nested=("$APP"/Contents/Resources/bin/*)
          [ "${#nested[@]}" -gt 0 ] || { echo "::error::no helper binaries found to sign"; exit 1; }
          for bin in "${nested[@]}"; do
            echo "signing $bin"
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$bin"
          done
          # Signing the helpers invalidates the app's seal, so the app is re-signed
          # after them.
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$APP"

      - name: Verify the signature before notarizing
        run: |
          set -euo pipefail
          APP="target/release/bundle/macos/Buzz.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # -dv prints TeamIdentifier but not Authority; Authority needs --verbose=4.
          codesign -dv --verbose=4 "$APP" 2>&1 \
            | grep -q "Authority=Developer ID Application: Beoflow B.V." \
            || { echo "::error::not signed with the Beoflow Developer ID"; exit 1; }
          codesign -dv "$APP" 2>&1 | grep -q "TeamIdentifier=2D9Q24N9UQ" \
            || { echo "::error::signed by the wrong team"; exit 1; }
          for bin in "$APP"/Contents/Resources/bin/*; do
            codesign --verify --strict --verbose=2 "$bin"
          done
          echo "version: $(defaults read "$PWD/$APP/Contents/Info" CFBundleShortVersionString)"

      - name: Notarize and staple
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          APP="target/release/bundle/macos/Buzz.app"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose=2 "$APP" \
            || { echo "::error::Gatekeeper still rejects the app after stapling"; exit 1; }

      - name: Package the app and a dmg
        run: |
          set -euo pipefail
          VERSION="${{ needs.setup.outputs.version }}"
          APP="target/release/bundle/macos/Buzz.app"
          mkdir -p "$RUNNER_TEMP/out"
          ditto -c -k --keepParent "$APP" \
            "$RUNNER_TEMP/out/Buzz_${VERSION}_aarch64.app.zip"
          # Built from the stapled app, so the dmg carries the ticket too.
          hdiutil create -quiet -volname "Buzz" -srcfolder "$APP" \
            -ov -format UDZO "$RUNNER_TEMP/out/Buzz_${VERSION}_aarch64.dmg"

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/build.keychain-db"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    needs: [setup, release-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.setup.outputs.version }}
          BASE_TAG: ${{ inputs.base_tag }}
          SOURCE_SHA: ${{ needs.release-macos.outputs.sha }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --title "Buzz $VERSION" \
            --notes "Causeway fork of block/buzz-app (Buzz 1.0): $BASE_TAG plus the causeway patch stack, built from ${SOURCE_SHA}.

          Signed with the Beoflow Developer ID, notarized and stapled. macOS arm64 only.

          Installs to /Applications/Buzz 1.0.app. The bundle id is xyz.block.buzz.desktop, so it coexists with Buzz 0.X (xyz.block.buzz.app)." \
            dist/*
