# Builds Buzz desktop from the private Causeway fork and publishes it here.
#
# Adapted from block/buzz .github/workflows/release.yml (desktop-v0.5.28). Differences:
# - source: ddfourtwo/buzz-desktop-fork at `ref` (an upstream desktop tag + the
#   causeway patch stack), checked out with the read-only FORK_DEPLOY_KEY;
# - macOS: Tauri's own signing + notarization (Beoflow Developer ID, App Store
#   Connect API key) instead of block/apple-codesign-action;
# - updater: our own key pair and this repo's latest.json.
# Only collaborators can dispatch it; there is no pull_request trigger, so
# fork PRs never see these secrets.
name: Release

concurrency:
  group: causeway-release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit of ddfourtwo/buzz-desktop-fork to build
        required: true
      version:
        description: Release version, e.g. 0.5.28-causeway.1
        required: true
      base_tag:
        description: Upstream block/buzz tag the stack sits on, e.g. desktop-v0.5.28
        required: true

env:
  FORK_REPO: ddfourtwo/buzz-desktop-fork
  UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
  APPLE_SIGNING_IDENTITY: "Developer ID Application: Beoflow B.V. (2D9Q24N9UQ)"

jobs:
  setup:
    name: Setup
    if: github.repository == 'ddfourtwo/buzz-causeway-releases'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$VERSION'. Expected semver (e.g. 0.5.28-causeway.1)"
            exit 1
          fi
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release v${VERSION} already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.FORK_DEPLOY_KEY }}
          persist-credentials: false

      - name: Pin the source commit
        id: source
        run: echo "source_sha=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

  release-macos:
    name: Release macOS (${{ matrix.arch }})
    runs-on: macos-latest
    needs: setup
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            artifact: desktop-release-macos-arm64
            features: --features mesh-llm
          - arch: x64
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            artifact: desktop-release-macos-x64
            features: ""
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ needs.setup.outputs.source_sha }}
          ssh-key: ${{ secrets.FORK_DEPLOY_KEY }}
          persist-credentials: false

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Add Rust target
        run: rustup target add "$TARGET"

      - name: Patch version
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Generate release config
        run: cd desktop && node scripts/build-release-config.mjs
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}

      - name: Build sidecars
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      # Mesh rev derived from Cargo.lock (no lockstep edit on dep bump); cache key tracks it.
      - name: Resolve mesh-llm rev
        if: matrix.arch == 'aarch64'
        id: mesh_rev
        run: |
          set -euo pipefail
          REV=$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.lock", "rb")); p=next(p for p in d["package"] if p["name"] == "mesh-llm-sdk"); print(p["source"].rsplit("#", 1)[1])')
          [[ -n "$REV" ]] || { echo "::error::could not resolve mesh-llm rev from Cargo.lock"; exit 1; }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "short=${REV:0:7}" >> "$GITHUB_OUTPUT"
      - name: Restore mesh llama build cache
        if: matrix.arch == 'aarch64'
        id: llama_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}
      - name: Build mesh llama native libraries
        if: matrix.arch == 'aarch64' && steps.llama_cache.outputs.cache-hit != 'true'
        env:
          MESH_REV_SHORT: ${{ steps.mesh_rev.outputs.short }}
        run: |
          set -euo pipefail
          cargo fetch --manifest-path desktop/src-tauri/Cargo.toml
          SHORT="$MESH_REV_SHORT"
          MESH_ROOT=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path "*/$SHORT" -type d -name "$SHORT" | head -1)
          if [[ -z "$MESH_ROOT" ]]; then
            echo "::error::mesh-llm checkout for $SHORT not found after cargo fetch"
            exit 1
          fi
          export LLAMA_STAGE_BACKEND=metal
          export LLAMA_STAGE_BUILD_DIR="$GITHUB_WORKSPACE/.cache/mesh-llama/build-stage-abi-metal"
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          "$MESH_ROOT/scripts/prepare-llama.sh" pinned
          "$MESH_ROOT/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Save mesh llama build cache
        if: matrix.arch == 'aarch64' && steps.llama_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}

      - name: Stage notarization key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # The fork's `shim: bundle .app only` limits local bundles to the .app,
      # so the DMG is requested explicitly here.
      - name: Build, sign and notarize Tauri app
        run: cd desktop && pnpm tauri build --verbose --target "$TARGET" --bundles app,dmg ${{ matrix.features }} --config src-tauri/tauri.release.conf.json
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          SKIPPY_LLAMA_AUTO_BUILD: "0"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Verify code signature
        run: |
          APP="desktop/src-tauri/target/${TARGET}/release/bundle/macos/Buzz.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          desktop/scripts/verify-macos-entitlements.sh "$APP"

      - name: Locate build artifacts
        id: artifacts
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"
          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -type f | head -1)
          [[ -n "$DMG" ]] || { echo "::error::No DMG found in $BUNDLE_DIR/dmg"; exit 1; }
          ARCHIVE=$(find "$BUNDLE_DIR/macos" -name '*.tar.gz' ! -name '*.sig' -type f | head -1)
          [[ -n "$ARCHIVE" && -f "${ARCHIVE}.sig" ]] || { echo "::error::Updater archive or signature not found in $BUNDLE_DIR/macos"; exit 1; }
          RENAMED="$(dirname "$ARCHIVE")/Buzz_${VERSION}_${{ matrix.arch }}.app.tar.gz"
          mv "$ARCHIVE" "$RENAMED"
          mv "${ARCHIVE}.sig" "${RENAMED}.sig"
          mkdir -p staged
          cp "$DMG" "$RENAMED" "${RENAMED}.sig" staged/

      - name: Stage macOS release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: staged/*

  release-linux:
    name: Release Linux
    runs-on: ubuntu-latest
    container: ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
    needs: setup
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # AppImage tools are themselves AppImages; containers lack FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      VERSION: ${{ needs.setup.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -o Acquire::Retries=3
          apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 \
            build-essential ca-certificates curl desktop-file-utils file git \
            libasound2-dev libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev openssh-client patchelf \
            pkg-config squashfs-tools wget xdg-utils

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ needs.setup.outputs.source_sha }}
          ssh-key: ${{ secrets.FORK_DEPLOY_KEY }}
          persist-credentials: false

      - name: Mark workspace safe for git (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install appimagetool
        run: |
          # Pinned like upstream: immutable tag + SHA256 for tool and runtime.
          wget -q --tries=3 --timeout=30 -O /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum -c
          install -m 755 /tmp/appimagetool /usr/local/bin/appimagetool
          wget -q --tries=3 --timeout=30 -O /tmp/appimage-runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/appimage-runtime" | sha256sum -c
          install -D -m 644 /tmp/appimage-runtime /usr/local/lib/appimage-runtime
          echo "APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime" >> "$GITHUB_ENV"

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Patch version
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh

      - name: Generate release config
        run: cd desktop && node scripts/build-release-config.mjs
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}

      - name: Build Linux Tauri app
        run: cd desktop && pnpm tauri build --verbose --ci --bundles deb,appimage --features mesh-llm --config src-tauri/tauri.release.conf.json
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Fix AppImage (remove infra libs, shim host GStreamer)
        run: |
          mapfile -t APPIMAGES < <(find desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f)
          [[ ${#APPIMAGES[@]} -eq 1 ]] || { echo "::error::Expected exactly one AppImage, found ${#APPIMAGES[@]}"; exit 1; }
          bash desktop/scripts/fix-appimage.sh "${APPIMAGES[0]}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Locate Linux build artifacts
        id: linux-artifacts
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"
          DEB=$(find "$BUNDLE_DIR/deb" -name '*.deb' -type f | head -1)
          APPIMAGE=$(find "$BUNDLE_DIR/appimage" -name '*.AppImage' -type f | head -1)
          [[ -n "$DEB" && -n "$APPIMAGE" ]] || { echo "::error::DEB or AppImage missing"; exit 1; }
          # Tauri 2.11+ signs the AppImage itself; older versions wrapped it in a tar.gz.
          ARCHIVE=$(find "$BUNDLE_DIR/appimage" -name '*.AppImage.tar.gz' ! -name '*.sig' -type f | head -1)
          [[ -n "$ARCHIVE" ]] || ARCHIVE="$APPIMAGE"
          [[ -f "${ARCHIVE}.sig" ]] || { echo "::error::AppImage updater signature not found"; exit 1; }
          mkdir -p staged
          cp "$DEB" "$APPIMAGE" staged/
          [[ "$ARCHIVE" == "$APPIMAGE" ]] || cp "$ARCHIVE" staged/
          cp "${ARCHIVE}.sig" staged/

      # .deb is not auto-updatable (Tauri updater supports only the AppImage on Linux).
      - name: Stage Linux release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-linux-x64
          if-no-files-found: error
          path: staged/*

  release-windows:
    name: Release Windows
    runs-on: windows-latest
    needs: setup
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ needs.setup.outputs.source_sha }}
          ssh-key: ${{ secrets.FORK_DEPLOY_KEY }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install desktop dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Patch version
        shell: bash
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Generate release config
        shell: bash
        run: cd desktop && node scripts/build-release-config.mjs
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}

      - name: Build sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build Windows NSIS installer (unsigned)
        shell: bash
        run: cd desktop && pnpm tauri build --verbose --target "$TARGET" --bundles nsis --config src-tauri/tauri.release.conf.json
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Locate Windows build artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"
          EXE=$(find "$BUNDLE_DIR/nsis" -name '*.exe' -type f | head -1)
          [[ -n "$EXE" && -f "${EXE}.sig" ]] || { echo "::error::NSIS installer or its updater signature not found"; exit 1; }
          # No Windows code-signing certificate: say so in the file name.
          MARKED="$(dirname "$EXE")/$(basename "$EXE" .exe)_unsigned.exe"
          mv "$EXE" "$MARKED"
          mv "${EXE}.sig" "${MARKED}.sig"
          mkdir -p staged
          cp "$MARKED" "${MARKED}.sig" staged/

      - name: Stage Windows release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-windows-x64
          if-no-files-found: error
          path: staged/*

  publish:
    name: Publish release and latest.json
    if: |
      always() &&
      needs.setup.result == 'success' &&
      needs.release-macos.result == 'success' &&
      needs.release-linux.result == 'success' &&
      needs.release-windows.result == 'success'
    runs-on: ubuntu-latest
    needs: [setup, release-macos, release-linux, release-windows]
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ needs.setup.outputs.source_sha }}
          ssh-key: ${{ secrets.FORK_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: desktop/scripts
          path: fork

      - name: Download staged release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-release-*
          path: staged
          merge-multiple: true

      # Each updater archive is the one staged file of its pattern that has a .sig.
      - name: Generate latest.json
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          TRIPLES=()
          for spec in "darwin-aarch64:Buzz_${VERSION}_aarch64.app.tar.gz" \
                      "darwin-x86_64:Buzz_${VERSION}_x64.app.tar.gz" \
                      "linux-x86_64:*.AppImage*" "windows-x86_64:*_unsigned.exe"; do
            platform="${spec%%:*}"
            pattern="${spec#*:}"
            mapfile -t found < <(cd staged && for f in $pattern; do [[ "$f" != *.sig && -f "$f.sig" ]] && echo "$f"; done)
            [[ ${#found[@]} -eq 1 ]] || {
              echo "::error::$platform: expected one signed updater archive matching '$pattern', found ${#found[@]}"; exit 1;
            }
            archive="${found[0]}"
            TRIPLES+=("${platform}:staged/${archive}.sig:${BASE}/${archive}")
          done
          bash fork/desktop/scripts/generate-oss-latest-json.sh "$VERSION" "${TRIPLES[@]}" > staged/latest.json
          cat staged/latest.json

      - name: Publish release
        env:
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
          BASE_TAG: ${{ inputs.base_tag }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Buzz desktop ${VERSION}: upstream \`${BASE_TAG}\` plus the Causeway patch stack (source commit \`${SOURCE_SHA:0:12}\`).

          Install: download the file for your platform below. macOS builds are signed and notarized; the Windows installer is not code-signed yet, so SmartScreen warns once. Installed copies update themselves from this repo.
          EOF
          gh release create "v${VERSION}" staged/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Buzz Causeway ${VERSION}" \
            --notes-file notes.md \
            --latest
